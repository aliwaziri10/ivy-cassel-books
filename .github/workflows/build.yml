name: rebuild-cards
on:
  workflow_dispatch: {}
  push:
    paths:
      - "config.json"
      - "tools/make_queue.py"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fonts and Pillow
        run: |
          sudo apt-get update -y && sudo apt-get install -y fonts-dejavu-core
          pip install pillow
      - name: Rebuild queue and images
        run: python3 tools/make_queue.py
      - name: Commit changes
        run: |
          git config user.name "poster-bot"
          git config user.email "poster-bot@users.noreply.github.com"
          git add images queue/posts.json queue/group_posts.md
          git diff --cached --quiet || (git commit -m "Rebuild cards and queue" && git push)
